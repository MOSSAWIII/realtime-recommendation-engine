services:
  test-db:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_recommendation_engine
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 10s
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
    networks:
      default:
        aliases:
          - db
          - test-db

  test-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15673:15672"  # Management UI
      - "5673:5672"    # AMQP port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: test_cookie
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.6"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      default:
        aliases:
          - rabbitmq
          - test-rabbitmq

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - TEST_MODE=true
      - TEST_MOCKING=false  # For integration tests with real DB
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_NAME=test_recommendation_engine
      - DB_USER=postgres
      - DB_PASSWORD=test_password
      - RABBITMQ_HOST=test-rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - TEST_VHOST=${TEST_VHOST:-test_env}  # Add vhost for isolation
      - TEST_RUN_ID=${TEST_RUN_ID}
      - DATABASE_URL=jdbc:postgresql://test-db:5432/test_recommendation_engine
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=test_password
      - DATABASE_HOST=test-db
      - DATABASE_PORT=5432
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
    volumes:
      - .:/app
      - ~/.sbt:/root/.sbt
      - ~/.ivy2:/root/.ivy2
      - ~/.colima/default/docker.sock:/var/run/docker.sock
    depends_on:
      test-db:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      default:
        aliases:
          - test-client

volumes:
  rabbitmq_test_data:
    driver: local