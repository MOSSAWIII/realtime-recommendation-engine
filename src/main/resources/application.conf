database {
  url = "jdbc:postgresql://localhost:5432/recommendation_engine"
  url = ${?DATABASE_URL}
  user = "mohamed.el.moussaoui"  // Using your PostgreSQL username
  user = ${?DATABASE_USER}
  password = ""  // Add password here if required
  password = ${?DATABASE_PASSWORD}
  poolSize = 10
}

rabbitmq {
  host = "localhost"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "/"
  virtualHost = ${?RABBITMQ_VIRTUALHOST}
}

redis {
  host = "localhost"
  host = ${?REDIS_HOST}
  port = 6379
  port = ${?REDIS_PORT}
  password = ""
  password = ${?REDIS_PASSWORD}
  timeout = 2000
  
  pool {
    maxTotal = 16
    maxIdle = 8
    minIdle = 2
  }
  
  cache {
    expirySeconds = 1800  # 30 minutes
  }
}

akka {
  http {
    server {
      preview.enable-http2 = on
    }
  }
}