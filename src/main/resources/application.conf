# Enhanced configuration structure for real-time recommendation engine

# Global configuration settings
config {
  # Time between configuration reload checks (seconds)
  reloadIntervalSeconds = 60
}

# Database configuration
database {
  # Database connection URL
  url = "jdbc:postgresql://db:5432/recommendation_engine"
  url = ${?DATABASE_URL}
  
  # Database credentials
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "password"
  password = ${?DATABASE_PASSWORD}
  
  # Connection pool settings
  poolSize = 10
  connectionTimeout = "30s"
  idleTimeout = "10m"
  maxLifetime = "30m"
  
  # Perform validation when application starts
  validateOnStartup = true
}

# RabbitMQ configuration
rabbitmq {
  # Connection details
  host = "rabbitmq"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "/"
  virtualHost = ${?RABBITMQ_VHOST}
  
  # Connection settings
  connectionTimeout = "30s"
  networkRecoveryInterval = "10s"
  automaticRecovery = true
  connectionRetries = 3
  
  # Queue definitions
  queues {
    processed_events_queue {
      durable = true
      exclusive = false
      autoDelete = false
      ttl = "24h"
      deadLetterEnabled = true
    }
    
    recommendations_queue {
      durable = true
      exclusive = false
      autoDelete = false
      ttl = "30m"
      deadLetterEnabled = true
    }
    
    historical_data_queue {
      durable = true
      exclusive = false
      autoDelete = false
      ttl = "7d"
      deadLetterEnabled = false
    }
  }
  
  # Binding definitions
  bindings = [
    { exchange = "user_actions_exchange", queue = "processed_events_queue", routingKey = "event.processed.#" },
    { exchange = "user_actions_exchange", queue = "recommendations_queue", routingKey = "recommendation.result.#" },
    { exchange = "user_actions_exchange", queue = "historical_data_queue", routingKey = "historical.data.#" }
  ]
}

# Recommender configuration
recommender {
  # Recommendation algorithm weights
  weights {
    currentBehavior = 0.6
    contextual = 0.3
    historical = 0.1
  }
  
  # Cache settings
  cache {
    userProfileSize = 10000
    eventSize = 5000
    userEventSize = 10000
    userFriendsSize = 10000
    recommendationTTL = "5m"
    maintenanceInterval = "5m"
  }
  
  # Circuit breaker settings
  circuitBreaker {
    failureThreshold = 5
    resetTimeout = "1m"
  }
  
  # Metrics settings
  metrics {
    logInterval = "1m"
  }
}

# Transformer configuration
transformer {
  # Channel settings
  channel {
    prefetchCount = 10
  }
  
  # Event processing settings
  processing {
    enableDelayedProcessing = false
    maxRetries = 3
    retryDelay = "5s"
  }
  
  # Publisher confirmation settings
  publisherConfirm {
    timeout = "30s"
  }
  
  # Exchange settings
  exchange {
    name = "user_actions_exchange"
    type = "topic"
    durable = true
  }
  
  # Routing templates
  routing {
    processedEventsTemplate = "event.processed.#"
    recommendationRequestTemplate = "recommendation.request.#"
  }
  
  # Metrics settings
  metrics {
    resetInterval = "10m"
  }
}

# Data manager configuration
dataManager {
  # Cache settings
  cache {
    l1Size = 10000
    l2Size = 100000
    defaultTTL = "30m"
    shortTTL = "5m"
    l2RefreshThreshold = 0.8
    maintenanceInterval = "1m"
    refreshQueueInterval = "10s"
  }
  
  # Query settings
  query {
    timeout = "30s"
    maxPoolSize = 20
    defaultBatchSize = 100
  }
  
  # Transaction settings
  transaction {
    timeout = "30s"
    maxRetries = 3
    retryDelay = "1s"
  }
  
  # Consumer settings
  consumers {
    processedEvents {
      enabled = true
      queueName = "processed_events_queue"
      prefetchCount = 50
      routingPattern = "event.processed.#"
    }
    historicalData {
      enabled = true
      queueName = "historical_data_queue"
      prefetchCount = 25
    }
  }
}

# Error configuration
error {
  # General error handling settings
  enableEnhancedLogging = true
  reportingEnabled = true
  stackTraceEnabled = true 
  maxRecentErrors = 100
  
  # Default retry settings
  retry {
    defaultMaxRetries = 3
    defaultInitialBackoffMs = 100
    defaultMaxBackoffMs = 10000
    defaultBackoffFactor = 2.0
  }
  
  # Default circuit breaker settings
  circuitBreaker {
    defaultFailureThreshold = 5
    defaultResetTimeoutMs = 30000
  }
}

# Metrics configuration
metrics {
  # General metrics settings
  enabled = true
  reportingIntervalSeconds = 60
  logDetailedMetrics = true
  
  # JMX reporting
  jmx {
    enabled = true
  }
  
  # Prometheus endpoint (if needed)
  prometheus {
    enabled = false
    port = 9095
  }
  
  # Health check settings
  healthCheck {
    enabled = true
    intervalSeconds = 30
    timeoutMs = 5000
  }
}