# Configuration de la base de données
database {
  url = "jdbc:postgresql://db:5432/recommendation_engine"
  url = ${?DATABASE_URL}
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "password"
  password = ${?DATABASE_PASSWORD}
  poolSize = 10
}

# Configuration RabbitMQ
rabbitmq {
  host = "rabbitmq"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "/"
}