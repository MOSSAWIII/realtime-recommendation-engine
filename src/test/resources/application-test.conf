# Configuration de la base de données pour les tests
database {
  url = "jdbc:postgresql://test-db:5432/recommendation_engine"
  url = ${?DATABASE_URL}
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "test_password"
  password = ${?DATABASE_PASSWORD}
  poolSize = 10
  host = ${?DB_HOST}
  port = ${?DB_PORT}
  name = ${?DB_NAME}
  poolSize = 5  # Smaller pool for tests
}

# Test configuration for Docker environment
rabbitmq {
  host = "test-rabbitmq"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "/"
  connectionTimeout = 5000  // Timeout en millisecondes
  connectionRetries = 3     // Nombre de tentatives
  connectionRetryDelay = 1000  // Délai entre tentatives en millisecondes
}

# Test-specific settings
test {
  enableMocking = true
}

test.enableMocking = true

