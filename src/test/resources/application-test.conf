# Test database configuration
database {
  url = "jdbc:postgresql://test-db:5432/test_recommendation_engine"
  url = ${?DATABASE_URL}
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "test_password"
  password = ${?DATABASE_PASSWORD}
  poolSize = 5
}

# Test configuration flags
test {
  mode = true
  enableMocking = true
}

# RabbitMQ configuration for tests
rabbitmq {
  host = "test-rabbitmq"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "test"
  virtualHost = ${?RABBITMQ_VHOST}
}
