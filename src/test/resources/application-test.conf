# Test database configuration
database {
  url = "jdbc:postgresql://test-db:5432/test_recommendation_engine"
  url = ${?DATABASE_URL}
  user = "postgres"
  user = ${?DATABASE_USER}
  password = "test_password"
  password = ${?DATABASE_PASSWORD}
  poolSize = 5
}

# Test configuration flags
test {
  mode = true
  enableMocking = true

  timeouts {
    default = "10 seconds"
    queueEmpty = "5 seconds" 
    consumerStart = "500 milliseconds"
  }
  
  delays {
    messagePublish = "50 milliseconds"
  }
  
  performance {
    eventBatchSize = 100
    minEventsPerSecond = 50.0
  }
}

# RabbitMQ configuration for tests
rabbitmq {
  host = "test-rabbitmq"
  host = ${?RABBITMQ_HOST}
  port = 5672
  port = ${?RABBITMQ_PORT}
  username = "guest"
  username = ${?RABBITMQ_USERNAME}
  password = "guest"
  password = ${?RABBITMQ_PASSWORD}
  virtualHost = "test"
  virtualHost = ${?RABBITMQ_VHOST}
}

# Include the base application configuration and override as needed
include "application.conf"
