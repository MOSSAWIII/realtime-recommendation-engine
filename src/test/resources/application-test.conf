include "application.conf"

# Test database configuration
database {
  // Use real database connection for integration tests
  mocking = false
  
  # These will be overridden by TestContainers
  url = "jdbc:postgresql://test-db:5432/test_recommendation_engine"
  url = ${?DATABASE_URL}
  username = "postgres"
  username = ${?DATABASE_USER}
  password = "test_password"
  password = ${?DATABASE_PASSWORD}
  poolSize = 5
  
  hikari {
    maximumPoolSize = 5
    minimumIdle = 1
    connectionTimeout = 5000      # Reduce from 30000 to 5000
    connectionInitSql = "SELECT 1"
    leakDetectionThreshold = 30000
    idleTimeout = 600000
    maxLifetime = 600000
  }
  
  # Validate connection on startup for tests
  validateOnStartup = true

  # Add statement timeout
  statementTimeout = 15000
}

# Test configuration flags
test {
  mode = "integration"
  enableMocking = false
  isolated = true
  mocking = false

  timeouts {
    default = "10 seconds"
    queueEmpty = "5 seconds" 
    consumerStart = "500 milliseconds"
  }
  
  delays {
    messagePublish = "50 milliseconds"
  }
  
  performance {
    eventBatchSize = 100
    minEventsPerSecond = 50.0
  }
}

# RabbitMQ configuration for tests
rabbitmq {
  host = "test-rabbitmq"
  port = 5672
  username = "guest"
  password = "guest"
  vhost = ${?TEST_VHOST}

  queues {
    processed_events = {
      name = "processed_events_queue"
      durable = true
      ttl = "24h"  # Utiliser le même format que production
      deadLetterEnabled = true
    }
    recommendations = {
      name = "recommendations_queue"  
      durable = true
      ttl = "30m"  # Format cohérent
      deadLetterEnabled = true
    }
    historical_data = {
      name = "historical_data_queue"
      durable = true
      ttl = "7d"   # Format cohérent
      deadLetterEnabled = false
    }
  }

  exchanges {
    user_actions = {
      name = "user_actions_exchange"
      type = "topic"
      durable = true
    }
    deadLetter = {
      name = "dlx"
      type = "direct"
      durable = true
    }
  }

  bindings = [
    {
      exchange = "user_actions_exchange"
      queue = "processed_events_queue"
      routingKey = "user.actions.#"
    },
    {
      exchange = "user_actions_exchange"
      queue = "processed_events_queue"
      routingKey = "event.processed.#"
    },
    {
      exchange = "user_actions_exchange"
      queue = "recommendations_queue"
      routingKey = "recommendation.result.#"
    },
    {
      exchange = "user_actions_exchange"
      queue = "recommendations_queue"
      routingKey = "recommendation.request.#"
    },
    {
      exchange = "user_actions_exchange"
      queue = "historical_data_queue"
      routingKey = "historical.data.#"
    }
  ]

  publisher {
    confirmTimeout = 5000  # Réduit pour tests
    maxRetries = 3
  }
}

# Data manager configuration for tests
dataManager {
  cache {
    l1Size = 1000      # Smaller cache for tests
    l2Size = 5000
    defaultTTL = "5m"   # Shorter TTL for tests
    shortTTL = "1m"
    l2RefreshThreshold = 0.8
    maintenanceInterval = "30s"
    refreshQueueInterval = "5s"
  }
  
  query {
    timeout = "10s"
    maxPoolSize = 5     # Smaller pool for tests
    defaultBatchSize = 50
  }
  
  transaction {
    timeout = "10s"
    maxRetries = 2      # Less retries for faster tests
    retryDelay = "500ms"
  }
}

# Metrics configuration for tests
metrics {
  enabled = true
  logInterval = "30s"
  exportInterval = "1m"
}

# Error configuration for tests
error {
  enableEnhancedLogging = true
  reportingEnabled = false    # Disable external reporting in tests
  stackTraceEnabled = true 
  maxRecentErrors = 50        # Smaller buffer for tests
  
  retry {
    defaultMaxRetries = 2
    defaultInitialBackoffMs = 50
    defaultMaxBackoffMs = 1000
    defaultBackoffMultiplier = 1.5
  }
}

# Logging configuration for tests
akka {
  loglevel = "INFO"
  stdout-loglevel = "INFO"
  
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
}
